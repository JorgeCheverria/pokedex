<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pokédex web con los 1025 Pokémon, datos de PokéAPI." />
    <meta name="theme-color" content="#e3350d" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pokédex" />
    <meta
      property="og:description"
      content="Los 1025 Pokémon: busca, filtra por tipo y generación, stats y evoluciones."
    />
    <meta property="og:url" content="https://jorgecheverria.github.io/pokedex/" />
    <meta property="og:image" content="https://jorgecheverria.github.io/pokedex/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://pokeapi.co" />
    <link rel="preconnect" href="https://raw.githubusercontent.com" />
    <title>Pokédex</title>
    <script>
      // Aplica el tema antes de pintar para evitar parpadeo (ver useTheme.ts).
      try {
        var t = JSON.parse(localStorage.getItem('pokedex:theme'))
        var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
